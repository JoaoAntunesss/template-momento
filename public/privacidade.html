<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<title>Privacidade</title>
<link rel="icon" href="img/icone.png"><link rel="stylesheet" href="base.css">
<script src="marca.js"></script><script src="core.js"></script>
<style>main{max-width:44rem;margin:0 auto;padding:60px 24px 90px}h1{font-size:54px;font-weight:300;margin-bottom:26px}h2{font-size:28px;margin:34px 0 10px}p,li{color:var(--suave);margin-bottom:12px}</style>
</head>
<body>
<header class="topo rolou"><div class="wrap barra"><a class="logo" href="index.html" id="logo"></a><a class="btn btn-linha btn-pq" href="index.html">Voltar ao site</a></div></header>
<main id="txt"></main>
<script>
const A = APP, M = A.M, e = A.esc, C = M.contactos; A.aplicarTema(); document.getElementById('logo').innerHTML = A.logoHtml(); document.title = 'Privacidade · ' + M.nome;
document.getElementById('txt').innerHTML = `<h1>Privacidade</h1>
<p>Este site pertence a ${e(M.nomeCompleto || M.nome)}${C.cidade ? ', ' + e(C.cidade) : ''}. Para qualquer questão sobre os teus dados: <a href="mailto:${e(C.email)}">${e(C.email)}</a>.</p>
<h2>Que dados guardo</h2><ul><li>Pedido de orçamento: nome, email, telemóvel, tipo de evento, data, local, número de convidados e a mensagem que escreves.</li><li>Área de cliente: mensagens, notas para o dia, ficheiros e links que partilhas comigo.</li></ul>
<h2>Para quê</h2><p>Só para responder ao teu pedido, preparar e fazer o trabalho combinado, e entregar-te as fotografias. Não envio publicidade nem partilho os dados com terceiros para fins comerciais.</p>
<h2>Onde ficam</h2><p>Na Google Firebase, na União Europeia (região ${e(M.regiaoBD)}). As fontes do site estão guardadas no próprio site, por isso o teu IP não é enviado a outros serviços quando o abres. A área de cliente guarda o teu código neste navegador para não teres de o escrever outra vez; carrega em “Sair” para o apagar.</p>
<h2>Durante quanto tempo</h2><p>Os pedidos que não avançam são apagados ao fim de um ano. A área de cliente fica ativa até um ano depois da entrega, e depois é apagada com tudo o que tem.</p>
<h2>Os teus direitos</h2><p>Podes pedir a qualquer momento para ver, corrigir ou apagar os teus dados, por email. Podes também apresentar queixa à CNPD (cnpd.pt).</p>`;
</script>
</body>
</html>
